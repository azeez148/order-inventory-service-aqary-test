[databases]
; Same Postgres DB under three aliases: separate write, reporting and read pools.
; Pool slots are isolated; CPU, I/O and database locks remain shared.
shop           = host=postgres port=5432 dbname=shop pool_size=20
shop_reporting = host=postgres port=5432 dbname=shop pool_size=4
shop_reads     = host=postgres port=5432 dbname=shop pool_size=10

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; Transaction pooling: a server connection is held only for the duration of a transaction.
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
query_wait_timeout = 30
ignore_startup_parameters = extra_float_digits,options
